<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f4f7;
            padding: 60px 15px;
        }

        .login-box {
            max-width: 380px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #245b75;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Staff Login</h2>

    <form id="staffLoginForm">

        <label>Username</label>
        <input type="text" id="username" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="submit">Sign In</button>

    </form>

    <p id="message"></p>

</div>

<script src="staffLogin.js"></script>

</body>
</html>
