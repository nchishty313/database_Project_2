<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anna - Staff Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f7;
            color: #263746;
        }

        header {
            background: #243d50;
            color: white;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        button {
            cursor: pointer;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
        }

        .logout {
            background: #e7e7e7;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 9px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 7px;
        }

        label {
            font-weight: bold;
        }

        .add-button {
            background: #245b75;
            color: white;
            margin-top: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #edf1f4;
        }

        .status-button {
            background: #e5eeee;
        }

        #message {
            margin-top: 15px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        @media(max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>Flooring Management</h2>
    <button class="logout" id="logoutButton">Logout</button>
</header>

<main>

    <h2>Welcome, Anna!</h2>
    <p>Manage flooring products and customer requests.</p>

    <section class="card">

        <h3>Add New Flooring Product</h3>

        <form id="productForm">

            <div class="form-grid">

                <div>
                    <label>Product Name</label>
                    <input id="product_name" required>
                </div>

                <div>
                    <label>Category</label>
                    <input id="category" required>
                </div>

                <div>
                    <label>Brand</label>
                    <input id="brand">
                </div>

                <div>
                    <label>Material Style</label>
                    <input id="material_style">
                </div>

                <div>
                    <label>Color</label>
                    <input id="color">
                </div>

                <div>
                    <label>Unit Price</label>
                    <input id="unit_price" type="number"
                           min="0" step="0.01" required>
                </div>

                <div>
                    <label>Pricing Unit</label>
                    <select id="pricing_unit" required>
                        <option value="SQFT">Square Feet</option>
                        <option value="BOX">Box</option>
                        <option value="PIECE">Piece</option>
                    </select>
                </div>

                <div>
                    <label>Dimensions</label>
                    <input id="dimensions">
                </div>

                <div>
                    <label>Square Feet Per Package</label>
                    <input id="sqft_per_package"
                           type="number" min="0.01" step="0.01">
                </div>

                <div>
                    <label>Description</label>
                    <textarea id="description"></textarea>
                </div>

            </div>

            <button class="add-button" type="submit">
                Add Product
            </button>

        </form>

        <p id="message"></p>

    </section>

    <section class="card">

        <h3>Flooring Product Inventory</h3>

        <button id="refreshButton">Refresh Products</button>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="productTable"></tbody>
            </table>
        </div>

    </section>

</main>

<script src="staffDashboard.js"></script>

</body>
</html>
