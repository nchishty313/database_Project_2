
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f7;
            padding: 50px 15px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #245b75;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Customer Login</h2>

    <form id="loginForm">

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="submit">Sign In</button>

    </form>

    <p id="message"></p>

    <p>
        Don't have an account?
        <a href="register.html">Register here</a>
    </p>

</div>

<script src="login.js"></script>

</body>
</html>
